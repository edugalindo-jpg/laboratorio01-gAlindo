<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laboratorio 01 - Proyecto Django">
    <title>Laboratorio 01 · Django</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(-45deg, #ff6ec4, #7873f5, #4adede, #fbbf24, #34d399);
            background-size: 400% 400%;
            animation: gradientMove 14s ease infinite;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.45;
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }

        .blob-1 { width: 340px; height: 340px; background: #f43f5e; top: -80px; left: -80px; }
        .blob-2 { width: 300px; height: 300px; background: #3b82f6; bottom: -90px; right: -60px; animation-delay: -4s; }
        .blob-3 { width: 240px; height: 240px; background: #a855f7; top: 40%; right: -100px; animation-delay: -7s; }

        @keyframes float {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(40px) scale(1.15); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            padding: 3rem;
            padding-top: 3.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(31, 38, 135, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 560px;
            width: 100%;
            overflow: hidden;
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #f43f5e, #f59e0b, #10b981, #3b82f6, #a855f7);
            background-size: 300% auto;
            animation: shine 6s linear infinite;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: bounce 1.6s ease-in-out infinite;
        }

        .dot:nth-child(1) { background: #f43f5e; }
        .dot:nth-child(2) { background: #f59e0b; animation-delay: 0.2s; }
        .dot:nth-child(3) { background: #10b981; animation-delay: 0.4s; }
        .dot:nth-child(4) { background: #3b82f6; animation-delay: 0.6s; }
        .dot:nth-child(5) { background: #a855f7; animation-delay: 0.8s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.7; }
            50%      { transform: translateY(-8px); opacity: 1; }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(-16px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .icon {
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, #f43f5e, #f59e0b, #8b5cf6);
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.2rem;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4);
        }

        h1 {
            font-size: clamp(1.9rem, 4.5vw, 2.6rem);
            margin-bottom: 0.75rem;
            font-weight: 800;
            background: linear-gradient(90deg, #f43f5e, #f59e0b, #10b981, #3b82f6, #a855f7, #f43f5e);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 6s linear infinite;
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        .subtitle {
            color: #475569;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .routes {
            display: grid;
            gap: 0.85rem;
            margin-bottom: 2rem;
        }

        .route {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.15rem;
            border-radius: 14px;
            background: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            border-left: 6px solid var(--c);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .route:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 26px color-mix(in srgb, var(--c) 40%, transparent);
        }

        .route code {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--c);
            background: color-mix(in srgb, var(--c) 12%, white);
            border: 1px solid color-mix(in srgb, var(--c) 35%, white);
            border-radius: 999px;
            padding: 0.3rem 0.75rem;
            white-space: nowrap;
        }

        .c-pink   { --c: #ec4899; }
        .c-violet { --c: #8b5cf6; }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(270deg, #ec4899, #8b5cf6, #06b6d4, #ec4899);
            background-size: 300% 300%;
            animation: gradientMove 6s ease infinite;
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.02em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.45);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 36px rgba(236, 72, 153, 0.5);
        }

        footer {
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            background: linear-gradient(90deg, #ffffff, #ffe4f3, #e0e7ff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <main class="container">
        <div class="dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="icon">🚀</div>
        <h1>Bienvenido a Laboratorio 01</h1>
        <p class="subtitle">Proyecto Django con vistas, plantillas y pruebas.<br>Estas son las rutas disponibles:</p>

        <div class="routes">
            <div class="route c-pink">
                <code>/</code>
                <span class="badge">Redirect → bienvenido</span>
            </div>
            <div class="route c-violet">
                <code>/session1/bienvenido/</code>
                <span class="badge">Vista principal</span>
            </div>
        </div>

        <a href="{% url 'session1:bienvenido' %}" class="btn">Ir a la vista</a>
    </main>

    <footer>Django · Session 1 · Laboratorio 01</footer>
</body>
</html>
